<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pendientes conversaciones</title>
<style>
  /* Estilo homologado con el Cotizador Interno (Valvoline): mismos colores, letra, cabecera roja y franja azul */
  :root{--val-red:#FF3333;--val-dark-blue:#003399;--val-light-blue:#0099CC;--val-light-gray:#D1D3D4;--val-dark-gray:#8B8D8D;--white:#fff;--bg:#f2f2f2;--text:#1a1a1a;--radius:8px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:15px}
  [hidden]{display:none!important}
  .wrap{max-width:1000px;margin:0 auto;padding:0 12px 40px}
  .hdr{background:var(--val-red);color:var(--white);box-shadow:0 2px 6px rgba(0,0,0,.25);position:sticky;top:0;z-index:100}
  .hdr-inner{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px 8px 21px}
  .hdr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--val-dark-blue)}
  .logo-img{height:42px;width:auto;display:block;flex-shrink:0}
  .hdr-title{font-size:16px;font-weight:700;letter-spacing:.3px;line-height:1.2}
  #login .hdr-title{font-size:11px;font-weight:500;color:rgba(255,255,255,.8);letter-spacing:.3px}
  .hdr-title small{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.8);margin-top:2px}
  .hdr-der{margin-left:auto;display:flex;align-items:center;gap:8px}
  #quien{font-size:11px;color:rgba(255,255,255,.85)}
  @media(max-width:600px){#quien{display:none}.hdr-title{font-size:15px}.hdr-title small{font-size:10px}.logo-img{height:36px}}
  .stripe{height:4px;background:linear-gradient(90deg,var(--val-dark-blue) 60%,var(--val-light-blue) 100%)}
  .btn{background:var(--val-dark-blue);color:var(--white);border:0;border-radius:var(--radius);padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
  .btn:hover{background:#00247a}
  .btn.sec{width:auto;background:transparent;border:1.5px solid rgba(255,255,255,.8);color:var(--white);font-weight:600;padding:6px 12px;font-size:12px}
  .btn.sec:hover{background:rgba(255,255,255,.15)}
  .btn.google{background:var(--white);color:#3c4043;border:1.5px solid var(--val-light-gray);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
  .btn.google:hover{background:#f7f8f8}
  .btn.google svg{width:20px;height:20px;flex-shrink:0}
  .tabsbar{background:var(--white);border-bottom:1px solid var(--val-light-gray);position:sticky;top:var(--hh,62px);z-index:99}
  .tabs{display:flex;overflow-x:auto;max-width:1000px;margin:0 auto}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;min-width:110px;padding-left:12px!important;padding-right:12px!important;padding:11px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--val-dark-gray);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;letter-spacing:.2px;font-family:inherit;transition:color .15s,border-color .15s}
  .tab.on{color:var(--val-red);border-bottom-color:var(--val-red)}
  .tab:hover:not(.on){color:var(--val-dark-blue);border-bottom-color:var(--val-light-blue)}
  #login{min-height:100vh;display:flex;flex-direction:column}
  #login .lg-body{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px}
  #login .lg-card{background:var(--white);border-radius:var(--radius);padding:20px 16px;width:100%;max-width:380px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-top:3px solid var(--val-red)}
  #login h2{margin:0 0 2px;font-size:17px;color:var(--val-dark-blue)}
  #login .hint{font-size:13px;color:var(--val-dark-gray);margin:2px 0 10px}
  .msg{color:var(--val-red);font-size:13px;min-height:18px;margin-top:10px}
  .card{background:var(--white);border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:10px;overflow:hidden;border-top:3px solid var(--val-red)}
  .card .pad{padding:13px}
  details.sec{background:var(--white);border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:10px;overflow:hidden;border-top:3px solid var(--val-red)}
  details.sec>summary{list-style:none;cursor:pointer;padding:13px;font-weight:700;font-size:14px;color:var(--val-dark-blue);display:flex;justify-content:space-between;gap:10px;align-items:center}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::after{content:"▾";color:var(--val-dark-gray);transition:transform .15s}
  details.sec[open]>summary::after{transform:rotate(180deg)}
  details.sec .cuerpo{padding:0 13px 13px}
  .ayuda{font-size:12px;color:var(--val-dark-gray);margin-bottom:10px}
  .tw{overflow-x:auto}
  .tw table{width:100%;min-width:720px;border-collapse:collapse;font-size:13px}
  .tw th{color:var(--val-dark-blue);border-bottom:2px solid var(--val-dark-blue)!important;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .tw td a,.cuerpo a{color:var(--val-dark-blue)}
  .plano{font-size:12px;color:var(--val-dark-gray);text-align:center;padding:10px}
  table.uso{width:100%;border-collapse:collapse;font-size:13px}
  table.uso th,table.uso td{padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:left}
  table.uso th{background:#f8f9fa;color:var(--val-dark-blue);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .cab{background:var(--white)}
  .frm{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:center}
  .frm input{padding:9px 11px;border:1.5px solid var(--val-light-gray);border-radius:6px;font-size:14px;font-family:inherit;width:100%}
  .frm input:focus{outline:none;border-color:var(--val-dark-blue);box-shadow:0 0 0 2px rgba(0,51,153,.12)}
  .frm .btn{width:auto;padding:10px 18px}
  .mini{border:1.5px solid var(--val-dark-blue);background:var(--white);color:var(--val-dark-blue);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .mini:hover{background:var(--val-dark-blue);color:var(--white)}
  .mini.peligro{border-color:var(--val-red);color:var(--val-red)}
  .mini.peligro:hover{background:var(--val-red);color:var(--white)}
  @media(max-width:600px){.frm{grid-template-columns:1fr}.frm .btn{width:100%}}
  details.sec{scroll-margin-top:calc(var(--hh,62px) + 52px)}
  /* recuadros de arriba: que se acomoden en celular sin salirse de la pantalla */
  .cab div[style*="display:flex"]{flex-wrap:wrap!important;gap:8px!important}
  .cab div[style*="display:flex"]>div{flex:1 1 92px!important;min-width:92px;padding:12px 6px!important}
  .cab [data-ir]{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
  .cab [data-ir]:hover,.cab [data-ir]:focus-visible{box-shadow:0 3px 10px rgba(0,0,0,.18);transform:translateY(-2px);border-color:var(--val-dark-blue)!important;outline:none}
  .cab [data-ir]:active{transform:translateY(0)}
  .cab [data-ir-vacio]{opacity:.55}
  .pista{padding:0 24px 12px;font-size:12px;color:var(--val-dark-gray);text-align:center}
  details.sec.flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--val-light-blue)}100%{box-shadow:0 1px 4px rgba(0,0,0,.08)}}
  #arriba{position:fixed;right:16px;bottom:18px;width:44px;height:44px;border-radius:50%;border:none;background:var(--val-dark-blue);color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;z-index:120}
  #arriba:hover{background:#00247a}
  /* colores que vienen escritos dentro del reporte (azul genérico -> azul Valvoline) */
  [style*="#1a56db"]{color:var(--val-dark-blue)!important}
  [style*="background:#1a56db"]{background:var(--val-dark-blue)!important;color:#fff!important}
  [style*="#b91c1c"]{color:#c62828!important}
</style>
</head>

  if (mail === ADMIN) return true;
  if (!u.emailVerified) return false;
  try { const sn = await getDoc(doc(db, COL_USUARIOS, mail)); return sn.exists() && sn.data().activo === true; }
  catch (e) { return false; }
}

// ---------- Registro de uso (quién abre, qué despliega, a quién le da clic en 💬) ----------
const movil = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'celular' : 'compu';
async function registrar(evento, extra) {
  if (!usuario) return;
  try {
    await addDoc(collection(db, COL_USO), Object.assign({
      email: usuario.email, nombre: usuario.displayName || '', evento: evento,
      reporte: actual ? actual.id : '', ts: serverTimestamp(), equipo: movil
    }, extra || {}));
  } catch (e) { /* si falla el registro, la página sigue funcionando */ }
}

// ---------- Entrada ----------
$('btnEntrar').addEventListener('click', async () => {
  $('loginMsg').textContent = '';
  const prov = new GoogleAuthProvider();
  prov.setCustomParameters({ prompt: 'select_account' });
  try { await signInWithPopup(auth, prov); }
  catch (e) {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) { try { await signInWithRedirect(auth, prov); } catch (e2) { $('loginMsg').textContent = 'No se pudo abrir el inicio de sesión.'; } }
    else if (e && e.code !== 'auth/popup-closed-by-user') $('loginMsg').textContent = 'No se pudo entrar (' + (e.code || 'error') + ').';
  }
});
$('btnSalir').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (u) => {
  if (!u) { usuario = null; $('app').hidden = true; $('login').hidden = false; return; }
  if (!(await tieneAcceso(u))) {
    $('loginMsg').textContent = 'La cuenta ' + u.email + ' no está dada de alta en esta página. Pídele a Carlos que te agregue.';
    await signOut(auth); return;
  }
  usuario = u; esAdmin = u.email.toLowerCase() === ADMIN;
  $('login').hidden = true; $('app').hidden = false;
  $('quien').textContent = u.email;
  await cargar();
});

// ---------- Cargar reportes ----------
async function cargar() {
  $('contenido').innerHTML = '<div class="plano">Cargando…</div>';
  try {
    const snap = await getDocs(query(collection(db, COL_REPORTE), orderBy('creado', 'desc'), limit(8)));
    reportes = snap.docs.map(d => d.data());
  } catch (e) {
    $('contenido').innerHTML = '<div class="plano">No se pudo leer el reporte (' + (e.code || 'error') + '). Si acabas de entrar por primera vez, avisa a Carlos.</div>';
    pintarTabs(); return;
  }
  if (!reportes.length) { $('contenido').innerHTML = '<div class="plano">Todavía no hay reportes guardados.</div>'; pintarTabs(); return; }
  const pedido = new URLSearchParams(location.search).get('r');
  actual = (pedido && reportes.find(r => r.tipo === pedido)) || reportes[0];
  await registrar('abrir', { tipoPedido: pedido || '' });
  pintarTabs(); pintar();
}

function etiquetaTipo(t) { return t === 'am' ? '🔔 Mañana (9:02)' : '🕒 Tarde (6 pm)'; }
function pintarTabs() {
  const tipos = []; reportes.forEach(r => { if (tipos.indexOf(r.tipo) < 0) tipos.push(r.tipo); });
  let h = '';
  tipos.forEach(t => {
    const r = reportes.find(x => x.tipo === t);
    h += '<button class="tab' + (!vistaUso && !vistaUsr && actual && actual.tipo === t ? ' on' : '') + '" data-tipo="' + t + '">' + etiquetaTipo(t) + ' · ' + fmtFecha(r.fecha) + '</button>';
  });
  if (esAdmin) h += '<button class="tab' + (vistaUso ? ' on' : '') + '" data-uso="1">📈 Uso de la página</button>';
  if (esAdmin) h += '<button class="tab' + (vistaUsr ? ' on' : '') + '" data-usr="1">👥 Usuarios</button>';
  $('tabs').innerHTML = h;
  $('tabs').querySelectorAll('.tab').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.uso) { vistaUso = true; vistaUsr = false; pintarTabs(); await pintarUso(); return; }
    if (b.dataset.usr) { vistaUsr = true; vistaUso = false; pintarTabs(); await pintarUsuarios(''); return; }
    vistaUso = false; vistaUsr = false; actual = reportes.find(r => r.tipo === b.dataset.tipo); registrar('cambiar_reporte'); pintarTabs(); pintar();
  }));
}
function fmtFecha(f) { const p = String(f || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : ''; }
function fmtCreado(iso) {
  try { return new Date(iso).toLocaleString('es-MX', { timeZone: 'America/Chihuahua', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true }); } catch (e) { return ''; }
}

// ---------- Pintar el reporte ----------
const ABIERTAS = (id) => id === 'sec-fh' || id.indexOf('sec-sin') === 0 || id === 'sec-seg';
function pintar() {
  const r = actual; if (!r) return;
  $('tituloReporte').textContent = r.titulo || 'Pendientes';
  $('subReporte').textContent = 'Reporte del ' + fmtFecha(r.fecha) + ' · generado ' + fmtCreado(r.creado);
  let secs = [];
  try { secs = JSON.parse(r.datos || '[]'); } catch (e) {}
  let h = '';
  h += '<div class="card cab">' + (r.cabeceraHtml || '') + (r.edadesHtml || '') + '</div>';
  secs.forEach(s => {
    h += '<details class="sec" id="' + s.id + '"' + (ABIERTAS(s.id) ? ' open' : '') + '><summary><span>' + s.titulo + '</span></summary>' +
      '<div class="cuerpo"><div class="ayuda">' + s.ayuda + '</div><div class="tw"><table>' + s.thead + '<tbody>' + s.rows.join('') + '</tbody></table></div></div></details>';
  });
  if (r.graficaHtml) h += '<details class="sec" id="grafica"><summary><span>📊 Cómo se va acumulando lo pendiente (por día)</span></summary><div class="cuerpo">' + r.graficaHtml + '</div></details>';
  if (r.coberturaHtml) h += '<div class="plano">' + r.coberturaHtml + '</div>';
  $('contenido').innerHTML = h;
  // Los enlaces de WhatsApp se abren en otra pestaña para no perder la página.
  $('contenido').querySelectorAll('a[href^="https://wa.me"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  // Se registra solo cuando la persona despliega una lista (clic en el título), no cuando la página las abre sola.
  $('contenido').querySelectorAll('details.sec > summary').forEach(sm => sm.addEventListener('click', () => { const d = sm.parentElement; if (!d.open) registrar('seccion', { seccion: d.id }); }));
  activarTarjetas();
  ajustarAlturas();
  abrirAncla();
}
function ajustarAlturas() {
  const h = document.querySelector('#app .hdr');
  if (h) document.documentElement.style.setProperty('--hh', (h.offsetHeight + 4) + 'px');
}
window.addEventListener('resize', ajustarAlturas);
// Los recuadros de arriba (sin atender, seguimiento, etc.) se vuelven botones que abren y llevan a su lista.
const MAPA_TARJETAS = [[/Fuera de horario/i, 'sec-fh'], [/Sin atender/i, 'sec-sin'], [/Seguimiento/i, 'sec-seg'], [/Esperando/i, 'sec-esp'], [/Clics? de anuncio/i, 'sec-clic']];
function irASeccion(id) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.tagName === 'DETAILS') el.open = true;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function activarTarjetas() {
  const cab = document.querySelector('#contenido .cab');
  if (!cab) return;
  let n = 0;
  cab.querySelectorAll('div').forEach(card => {
    if (card.children.length !== 2) return;
    const num = card.children[0], lab = card.children[1];
    if (num.children.length || lab.children.length || !/^\d+$/.test(num.textContent.trim())) return;
    const m = MAPA_TARJETAS.find(x => x[0].test(lab.textContent));
    if (!m) return;
    const existe = !!document.getElementById(m[1]);
    card.setAttribute('data-ir', m[1]);
    card.setAttribute('role', 'button'); card.setAttribute('tabindex', '0');
    if (!existe) { card.setAttribute('data-ir-vacio', '1'); card.title = 'No hay conversaciones en esta lista'; return; }
    card.title = 'Ir a esta lista';
    const ir = () => { irASeccion(m[1]); registrar('tarjeta', { seccion: m[1] }); };
    card.addEventListener('click', ir);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ir(); } });
    n++;
  });
  if (n) { const p = document.createElement('div'); p.className = 'pista'; p.textContent = '👆 Toca un recuadro para ir directo a su lista.'; cab.appendChild(p); }
}
// Botón para volver arriba sin tanto scroll
(function () {
  const b = document.getElementById('arriba');
  window.addEventListener('scroll', () => { b.style.display = window.scrollY > 500 ? 'block' : 'none'; }, { passive: true });
  b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
})();
function abrirAncla() {
  const id = decodeURIComponent((location.hash || '').slice(1));
  if (!id) return;
  const el = document.getElementById(id);
  if (el && el.tagName === 'DETAILS') { el.open = true; setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
}
window.addEventListener('hashchange', abrirAncla);

// Clic en 💬 (WhatsApp): se registra la sección y el teléfono (solo lo puede leer Carlos).
document.addEventListener('click', (ev) => {
  const a = ev.target.closest && ev.target.closest('a[href^="https://wa.me"]');
  if (!a) return;
  const sec = a.closest('details.sec');
  registrar('wa', { seccion: sec ? sec.id : '', tel: (a.getAttribute('href') || '').replace(/\D/g, '') });
});

// ---------- Vista de uso (solo Carlos) ----------
async function pintarUso() {
  $('tituloReporte').textContent = '📈 Uso de la página';
  $('subReporte').textContent = 'Últimos 14 días · solo lo ves tú';
  $('contenido').innerHTML = '<div class="plano">Cargando…</div>';
  let filas = [];
  try {
    const desde = new Date(Date.now() - 14 * 86400000);
    const snap = await getDocs(query(collection(db, COL_USO), where('ts', '>=', desde), orderBy('ts', 'desc'), limit(3000)));
    filas = snap.docs.map(d => d.data());
  } catch (e) { $('contenido').innerHTML = '<div class="plano">No se pudo leer el uso (' + (e.code || 'error') + ').</div>'; return; }
  const dia = (ts) => ts && ts.toDate ? new Date(ts.toDate().getTime() - 6 * 3600000).toISOString().slice(0, 10) : '';
  const m = {};
  filas.forEach(f => {
    const k = dia(f.ts) + '|' + f.email;
    const x = m[k] = m[k] || { dia: dia(f.ts), email: f.email, aper: 0, secc: 0, wa: 0, ultima: null, equipo: f.equipo };
    if (f.evento === 'abrir') x.aper++; else if (f.evento === 'seccion') x.secc++; else if (f.evento === 'wa') x.wa++;
    const t = f.ts && f.ts.toDate ? f.ts.toDate() : null;
    if (t && (!x.ultima || t > x.ultima)) x.ultima = t;
  });
  const lista = Object.values(m).sort((a, b) => (a.dia < b.dia ? 1 : -1) || (a.email < b.email ? -1 : 1));
  let h = '<div class="card"><div class="pad"><div class="ayuda">Aperturas = veces que entró a la página · Secciones = listas que desplegó · 💬 = clics para abrir WhatsApp con un cliente. Un clic en 💬 no prueba que el cliente haya recibido respuesta; solo que el asesor fue a atenderlo.</div>';
  h += '<table class="uso"><thead><tr><th>Día</th><th>Persona</th><th>Aperturas</th><th>Secciones</th><th>💬 clics</th><th>Última actividad</th></tr></thead><tbody>';
  lista.forEach(x => {
    const f = x.dia.split('-');
    h += '<tr><td>' + (f.length === 3 ? f[2] + '/' + f[1] : '') + '</td><td>' + x.email.replace(/</g, '&lt;') + '</td><td>' + x.aper + '</td><td>' + x.secc + '</td><td>' + x.wa + '</td><td>' + (x.ultima ? x.ultima.toLocaleTimeString('es-MX', { timeZone: 'America/Chihuahua', hour: '2-digit', minute: '2-digit', hour12: true }) : '') + '</td></tr>';
  });
  if (!lista.length) h += '<tr><td colspan="6" style="color:#64748b">Todavía no hay uso registrado.</td></tr>';
  h += '</tbody></table></div></div>';
  $('contenido').innerHTML = h;
}

// ---------- Usuarios (solo Carlos): quién puede entrar a la página ----------
async function pintarUsuarios(aviso) {
  $('tituloReporte').textContent = '👥 Usuarios';
  $('subReporte').textContent = 'Quién puede entrar a la página · solo lo ves tú';
  $('contenido').innerHTML = '<div class="plano">Cargando…</div>';
  let lista = [];
  try {
    const snap = await getDocs(collection(db, COL_USUARIOS));
    lista = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
  } catch (e) { $('contenido').innerHTML = '<div class="plano">No se pudo leer la lista (' + esc(e.code || 'error') + ').</div>'; return; }
  lista.sort((a, b) => String(a.nombre || a._id).localeCompare(String(b.nombre || b._id)));
  let h = '<div class="card"><div class="pad"><b>Agregar a una persona</b><div class="ayuda">Escribe el correo con el que entra a Google (el de la empresa). Desde ese momento puede abrir la página.</div>' +
    '<div class="frm"><input id="usrNombre" type="text" placeholder="Nombre (ej. Xenia)" autocomplete="off"><input id="usrCorreo" type="email" placeholder="correo@expresscarecuu.com" autocomplete="off"><button class="btn" id="usrAgregar" type="button">Agregar</button></div>' +
    '<div class="msg" id="usrMsg" style="color:#166534">' + esc(aviso || '') + '</div></div></div>';
  h += '<div class="card"><div class="pad"><table class="uso"><thead><tr><th>Nombre</th><th>Correo</th><th>Estado</th><th></th></tr></thead><tbody>';
  lista.forEach(u => {
    const act = u.activo === true;
    h += '<tr><td>' + esc(u.nombre || '') + '</td><td>' + esc(u.correo || u._id) + '</td><td>' + (act ? '<b style="color:#166534">Activo</b>' : '<span style="color:#8B8D8D">Desactivado</span>') + '</td>' +
      '<td style="white-space:nowrap"><button class="mini" data-acc="alt" data-id="' + esc(u._id) + '" data-act="' + (act ? '1' : '0') + '">' + (act ? 'Desactivar' : 'Activar') + '</button> <button class="mini peligro" data-acc="del" data-id="' + esc(u._id) + '">Quitar</button></td></tr>';
  });
  if (!lista.length) h += '<tr><td colspan="4" style="color:#8B8D8D">Todavía no hay personas en la lista. Solo tú puedes entrar.</td></tr>';
  h += '</tbody></table><div class="ayuda" style="margin-top:10px">Tu cuenta (' + esc(ADMIN) + ') siempre tiene acceso y no necesita estar en la lista. Quien no esté aquí, o esté desactivado, no puede ver nada.</div></div></div>';
  $('contenido').innerHTML = h;
  $('usrAgregar').addEventListener('click', async () => {
    const correo = $('usrCorreo').value.trim().toLowerCase(), nombre = $('usrNombre').value.trim();
    const m = $('usrMsg'); m.style.color = '#c62828';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) { m.textContent = 'Escribe un correo válido.'; return; }
    if (!nombre) { m.textContent = 'Escribe el nombre de la persona.'; return; }
    try { await setDoc(doc(db, COL_USUARIOS, correo), { correo: correo, nombre: nombre, activo: true, creado: serverTimestamp(), por: usuario.email }, { merge: true }); }
    catch (e) { m.textContent = 'No se pudo guardar (' + (e.code || 'error') + ').'; return; }
    await pintarUsuarios('Listo: ' + nombre + ' ya puede entrar.');
  });
  $('contenido').querySelectorAll('button[data-acc]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.id;
    try {
      if (b.dataset.acc === 'alt') await updateDoc(doc(db, COL_USUARIOS, id), { activo: b.dataset.act !== '1' });
      else { if (!confirm('¿Quitar a ' + id + ' de la lista? Ya no podrá entrar.')) return; await deleteDoc(doc(db, COL_USUARIOS, id)); }
    } catch (e) { $('usrMsg').style.color = '#c62828'; $('usrMsg').textContent = 'No se pudo cambiar (' + (e.code || 'error') + ').'; return; }
    await pintarUsuarios('Listo.');
  }));
}
</script>
